<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>참고자료 원문 미디어</title><style>*{box-sizing:border-box}body{margin:0;background:white;font:14px/1.6 system-ui;color:#10241a}#media{width:100%;margin:auto}iframe{border:0;max-width:100%}.youtube{width:100%;aspect-ratio:16/9;display:block}.instagram-media{margin:0 auto!important;min-width:0!important;width:100%!important}p{padding:12px;margin:0}a{color:#00693b}#fallback{border-top:1px solid #d4e3d9}</style><div id="media"></div><p id="fallback"></p><script>
const q=new URLSearchParams(location.search),yt=q.get('youtube'),ig=q.get('instagram'),root=document.querySelector('#media'),fallback=document.querySelector('#fallback');
let url='';
if(yt&&/^[A-Za-z0-9_-]{11}$/.test(yt)){const start=Math.max(0,Math.min(86400,Number(q.get('start'))||0));url='https://www.youtube.com/watch?v='+yt+(start?'&t='+start+'s':'');const f=document.createElement('iframe');f.className='youtube';f.title='YouTube 영상';f.allow='fullscreen; encrypted-media; picture-in-picture';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';f.src='https://www.youtube.com/embed/'+yt+'?playsinline=1&rel=0&start='+start;root.append(f);}
else if(ig&&/^[A-Za-z0-9_-]{5,30}$/.test(ig)){url='https://www.instagram.com/p/'+ig+'/';const b=document.createElement('blockquote');b.className='instagram-media';b.setAttribute('data-instgrm-permalink',url);b.setAttribute('data-instgrm-version','14');const a=document.createElement('a');a.href=url;a.textContent='Instagram 게시물 불러오는 중…';a.target='_blank';a.rel='noopener noreferrer';b.append(a);root.append(b);const s=document.createElement('script');s.async=true;s.src='https://www.instagram.com/embed.js';root.append(s);}
else fallback.textContent='지원하는 게시물 주소가 아닙니다.';
if(url){const a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='재생·표시가 안 되면 원문을 새 탭에서 열기 ↗';fallback.append(a);}
</script></html>
