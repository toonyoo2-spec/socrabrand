<svg xmlns="http://www.w3.org/2000/svg" width="800" height="830" viewBox="0 0 800 830" role="img"><title>편집스크립트: 수업자료 상위 폴더 하나를 선택하세요</title><style>text{font-family:Arial,"Noto Sans KR",sans-serif;fill:#20372a;font-size:20px}.small{font-size:16px;fill:#617568}.bold{font-weight:700}.green{fill:#00663a}.line{stroke:#c4d3c9;stroke-width:2;fill:none}</style><rect width="800" height="830" fill="#fff"/><text x="32" y="43" class="bold">편집스크립트 · 어떤 폴더를 선택하나요?</text><path d="M34 77h12l5 5h18v23h-35z" fill="#e6efe8" stroke="#53765f" stroke-width="1.5"/><text x="84" y="98" class="">작업 폴더</text><text x="280" y="98" class="small">KWAN에게 편집 권한으로 공유</text><path d="M51 114v578M51 153h40M51 692h40" class="line"/><rect x="90" y="125" width="670" height="466" rx="10" fill="#ecf7ef" stroke="#00663a" stroke-width="2.5"/><path d="M110 143h12l5 5h18v23h-35z" fill="#e6efe8" stroke="#53765f" stroke-width="1.5"/><text x="160" y="164" class="bold green">수업자료</text><text x="420" y="164" class="bold green">← 이 폴더를 선택하세요</text><text x="160" y="194" class="small">PPT 입력란에 이 폴더 링크 하나만 넣으세요.</text><path d="M127 215v330M127 245h40M127 427h40" class="line"/><path d="M167 227h12l5 5h18v23h-35z" fill="#e6efe8" stroke="#53765f" stroke-width="1.5"/><text x="215" y="248" class="bold">강의1</text><text x="216" y="285" class="small">PPT   1강, 2강 … 18강</text><text x="216" y="317" class="small">오디오   day1-1.mp3 · day1-2.mp3</text><text x="286" y="347" class="small">day18-1.mp3 · day18-2.mp3</text><path d="M167 409h12l5 5h18v23h-35z" fill="#e6efe8" stroke="#53765f" stroke-width="1.5"/><text x="215" y="430" class="bold">강의2</text><text x="216" y="467" class="small">PPT   1강, 2강 … 18강</text><text x="216" y="499" class="small">오디오   day1-1.mp3 · day1-2.mp3</text><text x="286" y="529" class="small">day18-1.mp3 · day18-2.mp3</text><text x="115" y="626" class="small">두 강의 폴더를 모두 찾고, 서로 섞지 않고 연결합니다.</text><path d="M93 677h12l5 5h18v23h-35z" fill="#e6efe8" stroke="#53765f" stroke-width="1.5"/><text x="142" y="698" class="">편집스크립트</text><text x="365" y="698" class="small">결과 저장 때 자동 생성</text><rect x="32" y="735" width="728" height="66" rx="8" fill="#f5f7f5"/><text x="50" y="761" class="small">1강 PPT 안의 표현1 → day1-1 / 표현2 → day1-2</text><text x="50" y="786" class="small">오디오 입력란은 비워 두세요. 다른 위치에 있을 때만 따로 선택합니다.</text></svg>