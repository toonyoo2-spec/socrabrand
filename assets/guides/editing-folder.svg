<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img"><title>편집스크립트: 프롬프트와 오디오가 함께 든 최상위 폴더를 선택합니다</title><style>text{font-family:Arial,"Noto Sans KR",sans-serif;fill:#20372a;font-size:20px}.small{font-size:16px;fill:#617568}.bold{font-weight:700}.green{fill:#00663a}.line{stroke:#c4d3c9;stroke-width:2;fill:none}</style><rect width="800" height="480" fill="#fff"/><text x="28" y="34" class="bold">Google Drive</text><rect x="28" y="59" width="744" height="345" rx="10" fill="#ecf7ef" stroke="#00663a" stroke-width="2.5"/><path d="M48 80h12l5 5h18v23h-35z" fill="#e6efe8" stroke="#53765f" stroke-width="1.5"/><text x="96" y="101" class="bold green">수업자료 폴더 (이름 자유)</text><text x="440" y="101" class="bold green">← 여기 선택</text><text x="97" y="133" class="small">이 폴더를 KWAN에게 편집 권한으로 공유하세요.</text><path d="M65 153v212M65 177h420M65 177h36M485 177v22M65 364h35" class="line"/><path d="M97 203h12l5 5h18v23h-35z" fill="#e6efe8" stroke="#53765f" stroke-width="1.5"/><text x="142" y="224" class="bold">프롬프트</text><path d="M472 203h12l5 5h18v23h-35z" fill="#e6efe8" stroke="#53765f" stroke-width="1.5"/><text x="518" y="224" class="bold">오디오</text><text x="104" y="264" class="small">1강 PPT · 2강 PPT · …</text><text x="104" y="296" class="small">하위 폴더가 있어도 찾아요.</text><text x="480" y="264" class="small">day1-1.mp3 · day1-2.mp3</text><text x="480" y="296" class="small">day18-1.mp3 · day18-2.mp3</text><path d="M97 347h12l5 5h18v23h-35z" fill="#e6efe8" stroke="#53765f" stroke-width="1.5"/><text x="142" y="368" class="">편집스크립트</text><text x="340" y="368" class="small">저장할 때 자동 생성</text><rect x="28" y="421" width="744" height="39" rx="8" fill="#f5f7f5"/><text x="43" y="447" class="small">필수 폴더명: 프롬프트 · 오디오   /   다른 파일이나 폴더가 함께 있어도 돼요.</text></svg>