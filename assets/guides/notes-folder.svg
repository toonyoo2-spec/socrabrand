<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img"><title>강의노트: PPT가 있는 폴더 또는 그 상위 폴더를 선택하세요</title><style>text{font-family:Arial,"Noto Sans KR",sans-serif;fill:#20372a;font-size:20px}.small{font-size:16px;fill:#617568}.bold{font-weight:700}.green{fill:#00663a}.line{stroke:#c4d3c9;stroke-width:2;fill:none}</style><rect width="800" height="480" fill="#fff"/><text x="28" y="34" class="bold">Google Drive</text><rect x="28" y="59" width="744" height="345" rx="10" fill="#ecf7ef" stroke="#00663a" stroke-width="2.5"/><path d="M48 80h12l5 5h18v23h-35z" fill="#e6efe8" stroke="#53765f" stroke-width="1.5"/><text x="96" y="101" class="bold green">자료 폴더 (이름 자유)</text><text x="440" y="101" class="bold green">← 여기 선택</text><path d="M65 125v240M65 166h35M65 263h35M65 363h35" class="line"/><path d="M97 151h12l5 5h18v23h-35z" fill="#e6efe8" stroke="#53765f" stroke-width="1.5"/><text x="142" y="172" class="bold">PPT 폴더</text><text x="144" y="207" class="small">1강 PPT · 2강 PPT · …</text><path d="M97 248h12l5 5h18v23h-35z" fill="#e6efe8" stroke="#53765f" stroke-width="1.5"/><text x="142" y="269" class="bold">다른 하위 폴더</text><text x="144" y="304" class="small">3강 PPT · 4강 PPT · …</text><path d="M97 348h12l5 5h18v23h-35z" fill="#e6efe8" stroke="#53765f" stroke-width="1.5"/><text x="142" y="369" class="">강의노트</text><text x="340" y="369" class="small">저장할 때 자동 생성</text><rect x="28" y="421" width="744" height="39" rx="8" fill="#f5f7f5"/><text x="43" y="447" class="small">PPT 폴더를 바로 선택해도 됩니다. 폴더 이름은 무엇이든 괜찮아요.</text></svg>