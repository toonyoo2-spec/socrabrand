<svg xmlns="http://www.w3.org/2000/svg" width="800" height="490" viewBox="0 0 800 490" role="img"><title>강의노트: PPT 파일이 직접 들어 있는 폴더를 선택하세요</title><style>text{font-family:Arial,"Noto Sans KR",sans-serif;fill:#20372a;font-size:20px}.small{font-size:16px;fill:#617568}.bold{font-weight:700}.green{fill:#00663a}.line{stroke:#c4d3c9;stroke-width:2;fill:none}</style><rect width="800" height="490" fill="#fff"/><text x="32" y="43" class="bold">강의노트 · 어떤 폴더를 선택하나요?</text><path d="M34 78h12l5 5h18v23h-35z" fill="#e6efe8" stroke="#53765f" stroke-width="1.5"/><text x="84" y="99" class="">Google Drive</text><path d="M51 115v265M51 157h40M51 379h40" class="line"/><rect x="90" y="128" width="670" height="190" rx="10" fill="#ecf7ef" stroke="#00663a" stroke-width="2.5"/><path d="M110 147h12l5 5h18v23h-35z" fill="#e6efe8" stroke="#53765f" stroke-width="1.5"/><text x="160" y="168" class="bold green">피피티</text><text x="400" y="168" class="bold green">← 이 폴더를 선택하세요</text><text x="160" y="209" class="small">1강 PPT</text><text x="160" y="240" class="small">2강 PPT</text><text x="160" y="271" class="small">18강 PPT …</text><text x="113" y="347" class="small">폴더 이름은 PPT, 피피티, 강의자료 등 무엇이든 괜찮아요.</text><path d="M93 364h12l5 5h18v23h-35z" fill="#e6efe8" stroke="#53765f" stroke-width="1.5"/><text x="142" y="385" class="">강의노트</text><text x="330" y="385" class="small">결과 저장 때 자동 생성</text><rect x="32" y="423" width="728" height="42" rx="8" fill="#f5f7f5"/><text x="50" y="451" class="small">PPT 파일이 보이는 바로 그 폴더를 선택하면 됩니다.</text></svg>