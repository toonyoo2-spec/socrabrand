<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480" viewBox="0 0 800 480" role="img"><title>여러 강의 묶음이 있으면 모두 담은 최상위 폴더를 선택합니다</title><style>text{font-family:Arial,"Noto Sans KR",sans-serif;fill:#20372a;font-size:20px}.small{font-size:16px;fill:#617568}.bold{font-weight:700}.green{fill:#00663a}.line{stroke:#c4d3c9;stroke-width:2;fill:none}</style><rect width="800" height="480" fill="#fff"/><text x="28" y="34" class="bold">같은 1강이 여러 묶음에 있는 경우</text><rect x="28" y="59" width="744" height="345" rx="10" fill="#ecf7ef" stroke="#00663a" stroke-width="2.5"/><path d="M48 80h12l5 5h18v23h-35z" fill="#e6efe8" stroke="#53765f" stroke-width="1.5"/><text x="96" y="101" class="bold green">최상위 폴더</text><text x="310" y="101" class="bold green">← 여기 선택</text><path d="M65 124v235M65 155h420M65 155h36M485 155v24M65 359h35" class="line"/><path d="M97 186h12l5 5h18v23h-35z" fill="#e6efe8" stroke="#53765f" stroke-width="1.5"/><text x="142" y="207" class="bold">A 강의 묶음</text><text x="104" y="249" class="small">프롬프트 폴더 + 오디오 폴더</text><text x="104" y="283" class="small">1강 PPT ↔ day1-1 · day1-2</text><path d="M472 186h12l5 5h18v23h-35z" fill="#e6efe8" stroke="#53765f" stroke-width="1.5"/><text x="517" y="207" class="bold">B 강의 묶음</text><text x="479" y="249" class="small">프롬프트 폴더 + 오디오 폴더</text><text x="479" y="283" class="small">1강 PPT ↔ day1-1 · day1-2</text><path d="M97 342h12l5 5h18v23h-35z" fill="#e6efe8" stroke="#53765f" stroke-width="1.5"/><text x="142" y="363" class="">편집스크립트</text><text x="340" y="363" class="small">묶음별로 구분해 저장</text><text x="42" y="444" class="small">오디오가 한곳에 있고 1강도 중복이면, 자동으로 추측하지 않고 직접 선택합니다.</text></svg>