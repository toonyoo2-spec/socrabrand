<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>강의 제작 · Socra</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="workspace-redesign.css?v=2"><style>
*{box-sizing:border-box}body.workspace-hub{margin:0;height:100dvh;display:flex;flex-direction:column;overflow:hidden}.workspace-hub .app-header{flex-shrink:0}.workspace-hub main{padding:0;max-width:none;margin:0;flex:1;min-height:0;width:100%}.workspace-hub [role=tabpanel]{height:100%;width:100%}.workspace-hub iframe{width:100%;height:100%;border:0;display:block;background:var(--ui-bg)}.workspace-hub [hidden]{display:none!important}.workspace-hub .tool-links button{border:0;min-height:40px;padding:10px 22px;background:transparent;color:var(--ui-muted);font-family:inherit;line-height:20px;font-size:14px}.workspace-hub .tool-links button[aria-selected=true]{background:var(--ui-white);color:var(--ui-green);box-shadow:0 1px 4px #253b2c0c;font-weight:700}.workspace-hub .tool-links button:hover{color:var(--ui-green)}@media(max-width:760px){.workspace-hub .tool-links button{flex:1;text-align:center;padding:10px 14px}}
</style></head><body class="socra-tool workspace-hub"><header class="app-header"><div class="app-brand"><a href="/">SOC<span>RA</span></a><span class="brand-divider"></span><span class="brand-context">강의 제작</span></div><nav class="tool-links" role="tablist" aria-label="강의 제작 도구"><button id="tab-notes" role="tab" aria-selected="true" aria-controls="panel-notes" data-tool="notes">강의노트</button><button id="tab-editing" role="tab" aria-selected="false" aria-controls="panel-editing" tabindex="-1" data-tool="editing">편집스크립트</button></nav></header><main><section id="panel-notes" role="tabpanel" aria-labelledby="tab-notes"><iframe id="frame-notes" title="강의노트 작업" data-src="lesson-notes.html?embed=1"></iframe></section><section id="panel-editing" role="tabpanel" aria-labelledby="tab-editing" hidden><iframe id="frame-editing" title="편집스크립트 작업" data-src="editing-script.html?embed=1"></iframe></section></main><script>
const tabs=[...document.querySelectorAll('[data-tool]')];function activate(tool,write=true){if(!['notes','editing'].includes(tool))tool='notes';tabs.forEach(tab=>{const active=tab.dataset.tool===tool;tab.setAttribute('aria-selected',String(active));tab.tabIndex=active?0:-1;document.getElementById('panel-'+tab.dataset.tool).hidden=!active;});const frame=document.getElementById('frame-'+tool);if(!frame.getAttribute('src'))frame.src=frame.dataset.src;if(write){const url=new URL(location.href);url.searchParams.set('tool',tool);history.replaceState(null,'',url);}document.title=(tool==='notes'?'강의노트':'편집스크립트')+' · Socra 강의 제작';}tabs.forEach(tab=>{tab.onclick=()=>activate(tab.dataset.tool);tab.onkeydown=e=>{let index=tabs.indexOf(tab);if(e.key==='ArrowRight'||e.key==='ArrowLeft')index=(index+(e.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;else if(e.key==='Home')index=0;else if(e.key==='End')index=tabs.length-1;else return;e.preventDefault();tabs[index].focus();activate(tabs[index].dataset.tool);};});window.addEventListener('popstate',()=>activate(new URLSearchParams(location.search).get('tool'),false));activate(new URLSearchParams(location.search).get('tool'),false);
</script></body></html>
