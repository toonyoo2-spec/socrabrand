 ['다음 제작에 보관','확인한 배울 점을 기록해 다음 기획에 참고합니다.']]]
};
for(const [key,[name,steps]] of Object.entries(flows)){
 const coords=[[40,70],[360,70],[680,70],[680,340],[360,340],[40,340]];
 maps[key]={w:970,h:610,caption:'['+name+']에서 이어지는 흐름입니다. 이번 요청에 필요한 단계만 진행하며 검수·수정이 끝나야 다음 작업으로 넘어갑니다.',nodes:steps.map(([title,desc],i)=>node(key+i,...coords[i],title,'['+name+'] · '+(i+1),desc)),edges:steps.slice(1).map((_,i)=>[key+i,key+(i+1),'step']),labels:[]};
 maps.all.nodes.find(n=>n.id===key).go=key;
 const tab=document.createElement('button');tab.dataset.map=key;tab.setAttribute('role','tab');tab.setAttribute('aria-selected','false');tab.textContent=name.replace('자동화','');document.querySelector('.tabs').append(tab);
}
maps.all.caption='파란 노드를 누르면 해당 채팅의 작업 순서가 펼쳐집니다. 노드를 끌면 그 노드만 움직이고, 빈 배경을 끌면 전체 지도가 움직입니다.';

const canvas=document.getElementById('canvas'),viewport=document.getElementById('viewport');let active='all',scale=1,tx=0,ty=0,drag=null,els={},svg=null,suppressClick=false;
function transform(){canvas.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`}
function fit(){const m=maps[active];scale=Math.min((viewport.clientWidth-30)/m.w,(viewport.clientHeight-45)/m.h,1);tx=(viewport.clientWidth-m.w*scale)/2;ty=14;transform()}
function zoom(f){const x=viewport.clientWidth/2,y=viewport.clientHeight/2,old=scale;scale=Math.max(.25,Math.min(1.8,scale*f));tx=x-(x-tx)*scale/old;ty=y-(y-ty)*scale/old;transform()}
for(const n of maps.all.nodes){n.x=35+(n.x-80)*.72;n.y=35+(n.y-80)*.77}maps.all.w=980;maps.all.h=710;maps.all.labels=[{x:360,y:675,text:'일시정지된 자동화는 자동 실행하지 않습니다.'}];
const initialPositions=Object.fromEntries(Object.entries(maps).map(([k,m])=>[k,m.nodes.map(n=>({x:n.x,y:n.y}))]));
function drawWires(){const m=maps[active],ns='http://www.w3.org/2000/svg';svg.querySelectorAll('.wire').forEach(e=>e.remove());for(const [from,to,type]of m.edges){const a=m.nodes.find(n=>n.id===from),b=m.nodes.find(n=>n.id===to);let x1=a.x+122.5,y1=a.y+els[from].offsetHeight/2,x2=b.x+122.5,y2=b.y+els[to].offsetHeight/2;let d;if(Math.abs(x2-x1)>Math.abs(y2-y1)){const dir=x2>x1?1:-1;x1+=dir*122.5;x2-=dir*122.5;const mid=(x1+x2)/2;d=`M${x1},${y1} C${mid},${y1} ${mid},${y2} ${x2},${y2}`}else{const dir=y2>y1?1:-1;y1+=dir*els[from].offsetHeight/2;y2-=dir*els[to].offsetHeight/2;const mid=(y1+y2)/2;d=`M${x1},${y1} C${x1},${mid} ${x2},${mid} ${x2},${y2}`}const p=document.createElementNS(ns,'path');p.setAttribute('d',d);p.setAttribute('class','wire '+(type||''));svg.append(p)}}
function render(key){active=key;const m=maps[key];canvas.replaceChildren();canvas.style.width=m.w+'px';canvas.style.height=m.h+'px';document.getElementById('caption').textContent=m.caption;document.querySelectorAll('[data-map]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.map===key)));const ns='http://www.w3.org/2000/svg';svg=document.createElementNS(ns,'svg');svg.classList.add('wires');svg.setAttribute('aria-hidden','true');svg.innerHTML='<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#3a7860"/></marker><marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#bc8a49"/></marker></defs>';canvas.append(svg);els={};for(const n of m.nodes){const e=document.createElement(n.go?'button':'article');e.className='node '+n.kind+(n.go?' interactive':'');e.dataset.nodeId=n.id;e.tabIndex=0;e.style.left=n.x+'px';e.style.top=n.y+'px';for(const [cl,txt]of[['tag',n.tag],['title',n.title],['desc',n.desc],['time',n.time]]){if(!txt)continue;const c=document.createElement(cl==='title'?'strong':'span');c.className=cl;c.textContent=txt;e.append(c)}if(n.go){e.onclick=()=>render(n.go);e.setAttribute('aria-label',n.title+' 연결 지도 보기')}canvas.append(e);els[n.id]=e}drawWires();for(const l of m.labels||[]){const e=document.createElement('div');e.className='group-label';e.style.left=l.x+'px';e.style.top=l.y+'px';e.textContent=l.text;canvas.append(e)}fit()}
document.querySelectorAll('[data-map]').forEach(b=>b.onclick=()=>render(b.dataset.map));document.getElementById('fit').onclick=fit;document.getElementById('plus').onclick=()=>zoom(1.25);document.getElementById('minus').onclick=()=>zoom(.8);
document.getElementById('reset').onclick=()=>{maps[active].nodes.forEach((n,i)=>Object.assign(n,initialPositions[active][i]));render(active)};
viewport.addEventListener('pointerdown',e=>{
 if(e.button!==0||drag)return;
 const el=e.target.closest('.node');
 const n=el?maps[active].nodes.find(n=>n.id===el.dataset.nodeId):null;
 suppressClick=false;
 drag={id:e.pointerId,x:e.clientX,y:e.clientY,tx,ty,n,el,nx:n?.x,ny:n?.y,moved:false};
 (el||viewport).setPointerCapture(e.pointerId);
});
viewport.addEventListener('pointermove',e=>{
 if(!drag||drag.id!==e.pointerId)return;
 const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(!drag.moved&&Math.hypot(dx,dy)<6)return;
 drag.moved=true;suppressClick=true;
 if(drag.n){
  const m=maps[active];drag.n.x=Math.max(-m.w,Math.min(2*m.w-drag.el.offsetWidth,drag.nx+dx/scale));drag.n.y=Math.max(-m.h,Math.min(2*m.h-drag.el.offsetHeight,drag.ny+dy/scale));
  drag.el.style.left=drag.n.x+'px';drag.el.style.top=drag.n.y+'px';drag.el.classList.add('moving');drawWires();
 }else{tx=drag.tx+dx;ty=drag.ty+dy;transform();viewport.classList.add('dragging')}
});
viewport.addEventListener('click',e=>{if(suppressClick){e.preventDefault();e.stopImmediatePropagation();suppressClick=false}},true);
function end(e){if(!drag||drag.id!==e.pointerId)return;drag.el?.classList.remove('moving');drag=null;viewport.classList.remove('dragging')}
viewport.addEventListener('pointerup',end);viewport.addEventListener('pointercancel',end);
viewport.addEventListener('keydown',e=>{
 const el=e.target.closest('.node');if(!el||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;
 e.preventDefault();const n=maps[active].nodes.find(n=>n.id===el.dataset.nodeId),step=e.shiftKey?30:10,m=maps[active];
 n.x=Math.max(-m.w,Math.min(2*m.w-el.offsetWidth,n.x+(e.key==='ArrowRight'?step:e.key==='ArrowLeft'?-step:0)));
 n.y=Math.max(-m.h,Math.min(2*m.h-el.offsetHeight,n.y+(e.key==='ArrowDown'?step:e.key==='ArrowUp'?-step:0)));
 el.style.left=n.x+'px';el.style.top=n.y+'px';drawWires();
});
window.addEventListener('resize',fit);render('all');
</script></body></html>
